name: Refresh daily questions
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify today's questions
        run: python scripts/update_daily.py
      - name: Commit only a verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/daily.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Krillion daily questions"
            git push
          fi
